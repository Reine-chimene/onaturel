[project]
name = "onaturelle-api"
version = "0.1.0"
description = "API propriétaire O'Naturelle — une seule enseigne, pas de multi-tenant."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0,<0.116.0",
  "uvicorn[standard]>=0.32.0",
  "sqlalchemy>=2.0.36",
  "psycopg[binary]>=3.2.0",
  "alembic>=1.14.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.6.0",
  "email-validator>=2.2.0",
  "pyjwt>=2.10.0",
  "pwdlib[argon2]>=0.2.1",
  "python-multipart>=0.0.18",
  "minio>=7.2.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "httpx>=0.28.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
